[package]
name = "omaread"
version = "0.1.0"
edition = "2024"

[dependencies]
anyrender = "0.6"
anyrender_vello = "0.6"
blitz-dom = "0.2.4"
blitz-html = "0.2.0"
blitz-paint = "0.2.1"
blitz-traits = "0.2.0"
hyphenation = { version = "0.8.4", features = ["embed_all"] }
kurbo = "0.12"
# Pinned by blitz-dom; named directly for text selection (Cursor/Selection).
parley = "0.6"
peniko = "0.5"
rbook = "0.7.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
winit = "0.30.13"

[dev-dependencies]
# Already in the tree, pinned by blitz-dom. Only the font test names it: it
# needs `Blob` to hand a bundled face to a `Collection` directly.
fontique = "0.6"
